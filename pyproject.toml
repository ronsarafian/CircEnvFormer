[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circenvformer"
version = "0.1.0"
description = "Environmentally supervised atmospheric representation learning for synoptic classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "cartopy",
  "tqdm",
  "einops",
  "torch",
  "torchvision",
]

[tool.setuptools.packages.find]
where = ["src"]
